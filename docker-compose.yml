version: '3.8'

services:

  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: usuario
      POSTGRES_PASSWORD: senha
      POSTGRES_DB: auladb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U usuario -d auladb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  mongo:
    image: mongo
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network
      
  time:
    build:
      context: ./projeto-software-2026-2-time
      dockerfile: Dockerfile
    container_name: futebol_api
    ports:
      - "5001:5000"
    environment:
      DB_HOST: mongo
      DB_NAME: ${DB_NAME:-futebol_db}
      DB_PORT: 27017
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  partida:
    build:
      context: ./projeto-software-2026-2-partida
      dockerfile: Dockerfile
    container_name: partida-api
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_USER: usuario
      DB_PASSWORD: senha
      TIME_APP_URL: http://time:5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network




volumes:
  postgres_data:
  mongo_data:

networks:
  app-network:
    driver: bridge
