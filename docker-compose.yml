version: '3.8'

services:
  mongo:
    image: mongo
    container_name: futebol_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: futebol_api
    ports:
      - "5001:5000"
    environment:
      DB_HOST: mongo
      DB_NAME: ${DB_NAME:-futebol_db}
      DB_PORT: 27017
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
